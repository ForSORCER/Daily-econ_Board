
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAILY ECON BOARD</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px;
  background: #101820;
  color: #edf2f7;
  font-family: Arial, sans-serif;
}
.container { max-width: 1050px; margin: auto; }
header { margin-bottom: 30px; }
h1 { font-size: 27px; letter-spacing: 1px; margin-bottom: 8px; }
.subtitle { color: #9aa8b5; font-size: 13px; }
.update { color: #8d9ba8; font-size: 12px; margin-top: 12px; }
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.card {
  background: #1b2935;
  border: 1px solid #30404d;
  border-radius: 12px;
  padding: 22px;
  min-height: 145px;
  cursor: pointer;
  transition: 0.2s;
}
.card:hover { border-color: #64b99a; transform: translateY(-2px); }
.card.placeholder {
  background: #18232d;
  border-style: dashed;
  cursor: default;
  opacity: 0.65;
}
.card.placeholder:hover { transform: none; border-color: #30404d; }
.card-title { color: #aab8c4; font-size: 14px; }
.card-value { font-size: 27px; font-weight: bold; margin-top: 20px; }
.card-date { color: #81909d; font-size: 12px; margin-top: 9px; }
.detail {
  display: none;
  margin-top: 24px;
  padding: 24px;
  background: #1b2935;
  border: 1px solid #30404d;
  border-radius: 12px;
}
.detail h2 { margin-top: 0; }
.close {
  float: right;
  background: #30404d;
  color: white;
  border: 0;
  padding: 8px 13px;
  border-radius: 6px;
  cursor: pointer;
}
.detail-value { font-size: 30px; font-weight: bold; margin: 20px 0 5px; }
.detail-date { color: #9aa8b5; font-size: 13px; }
.chart { width: 100%; margin-top: 20px; }
.chart svg { width: 100%; height: 220px; overflow: visible; }
.chart-line { fill: none; stroke: #62c5a1; stroke-width: 3; }
.chart-labels {
  display: flex;
  justify-content: space-between;
  color: #8d9ba8;
  font-size: 11px;
}
.data-list { margin-top: 20px; }
.data-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid #30404d;
  font-size: 13px;
}
.notice { color: #9aa8b5; font-size: 13px; margin-top: 18px; }
footer { color: #71808d; font-size: 11px; margin-top: 30px; }
@media (max-width: 600px) {
  body { padding: 16px; }
  h1 { font-size: 23px; }
  .card { padding: 17px; min-height: 130px; }
  .card-value { font-size: 22px; }
  .detail { padding: 17px; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>DAILY ECON BOARD</h1>
    <div class="subtitle">주요 경제지표 한눈에 보기</div>
    <div class="update" id="updateTime">데이터 확인 중...</div>
  </header>

  <main class="grid" id="cardGrid">
    <div class="card" onclick="showDetail('환율')">
      <div class="card-title">USD/KRW</div>
      <div class="card-value" id="환율Value">불러오는 중...</div>
      <div class="card-date" id="환율Date">ECOS 데이터</div>
    </div>

    <div class="card" onclick="showDetail('기준금리')">
      <div class="card-title">한국 기준금리</div>
      <div class="card-value" id="기준금리Value">불러오는 중...</div>
      <div class="card-date" id="기준금리Date">ECOS 데이터</div>
    </div>
  </main>

  <section class="detail" id="detailPanel">
    <button class="close" onclick="closeDetail()">닫기</button>
    <h2 id="detailTitle">상세정보</h2>
    <div class="detail-value" id="detailValue">--</div>
    <div class="detail-date" id="detailDate"></div>
    <div class="chart" id="chartArea"></div>
    <div class="data-list" id="dataList"></div>
    <div class="notice">자료 출처: 한국은행 ECOS</div>
  </section>

  <footer>
    본 화면은 한국은행 ECOS 공개 통계를 이용합니다.
  </footer>
</div>

<script>
let economyData = {};

const placeholders = ["A", "B", "C", "D", "E", "F"];
placeholders.forEach(letter => {
  const card = document.createElement("div");
  card.className = "card placeholder";
  card.innerHTML = `
    <div class="card-title">항목 ${letter}</div>
    <div class="card-value">--</div>
    <div class="card-date">추후 추가 예정</div>
  `;
  document.getElementById("cardGrid").appendChild(card);
});

function getSorted(list) {
  return Array.isArray(list)
    ? [...list].sort((a, b) =>
        String(a.time).localeCompare(String(b.time))
      )
    : [];
}

function getLatest(list) {
  const sorted = getSorted(list);
  return sorted.length ? sorted[sorted.length - 1] : null;
}

function formatValue(item, category) {
  if (!item || item.value === undefined || item.value === null) {
    return "데이터 준비 중";
  }

  const number = Number(String(item.value).replace(/,/g, ""));
  if (!Number.isFinite(number)) return item.value;

  if (category === "환율") {
    return Math.round(number).toLocaleString("ko-KR") + "원";
  }

  return number.toLocaleString("ko-KR", {
    maximumFractionDigits: 2
  }) + "%";
}

function formatDate(time, category) {
  const value = String(time || "");

  if (category === "기준금리" && /^\d{6}$/.test(value)) {
    return value.substring(0, 4) + "년 " +
      Number(value.substring(4, 6)) + "월";
  }

  if (category === "환율" && /^\d{8}$/.test(value)) {
    return value.substring(0, 4) + "-" +
      value.substring(4, 6) + "-" +
      value.substring(6, 8);
  }

  return value;
}

function displayMain(category) {
  const list = economyData.observations?.[category] || [];
  const latest = getLatest(list);

  const valueElement = document.getElementById(category + "Value");
  const dateElement = document.getElementById(category + "Date");

  if (!latest) {
    valueElement.textContent = "데이터 준비 중";
    dateElement.textContent = "관측값을 찾을 수 없습니다";
    return;
  }

  valueElement.textContent = formatValue(latest, category);
  dateElement.textContent =
    "기준일: " + formatDate(latest.time, category);
}

async function loadData() {
  try {
    const response = await fetch(
      "./data/economy_catalog.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("데이터 파일을 불러오지 못했습니다.");
    }

    economyData = await response.json();

    displayMain("환율");
    displayMain("기준금리");

    document.getElementById("updateTime").textContent =
      "데이터 수집 시각: " +
      (economyData.updated_at || "확인 중");

  } catch (error) {
    document.getElementById("환율Value").textContent = "데이터 준비 중";
    document.getElementById("기준금리Value").textContent = "데이터 준비 중";
    document.getElementById("updateTime").textContent =
      "데이터를 불러오지 못했습니다.";
    console.error(error);
  }
}

function showDetail(category) {
  const list = getSorted(
    economyData.observations?.[category] || []
  );

  const latest = getLatest(list);

  document.getElementById("detailPanel").style.display = "block";
  document.getElementById("detailTitle").textContent =
    category === "환율" ? "USD/KRW 환율" : "한국 기준금리";

  document.getElementById("detailValue").textContent =
    latest ? formatValue(latest, category) : "데이터 준비 중";

  document.getElementById("detailDate").textContent =
    latest
      ? "최근 관측 기준일: " + formatDate(latest.time, category)
      : "";

  // 기준금리는 최근 6개월만 표시
  const displayList = category === "기준금리"
    ? list.slice(-6)
    : list.slice(-60);

  drawChart(displayList);
  drawDataList(displayList, category);

  document.getElementById("detailPanel").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function drawChart(list) {
  const area = document.getElementById("chartArea");

  const valid = list.map(item => ({
    time: item.time,
    value: Number(String(item.value).replace(/,/g, ""))
  })).filter(item => Number.isFinite(item.value));

  if (valid.length < 2) {
    area.innerHTML =
      '<div class="notice">그래프를 표시할 데이터가 부족합니다.</div>';
    return;
  }

  const points = valid;
  const values = points.map(p => p.value);
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;

  const coords = points.map((p, i) => {
    const x = 5 + i * 390 / (points.length - 1);
    const y = 190 - ((p.value - min) / range) * 165;
    return `${x},${y}`;
  }).join(" ");

  area.innerHTML = `
    <svg viewBox="0 0 400 210" preserveAspectRatio="none">
      <line x1="5" y1="190" x2="395" y2="190" stroke="#40505d"/>
      <polyline class="chart-line" points="${coords}"/>
    </svg>
    <div class="chart-labels">
      <span>${points[0].time}</span>
      <span>${points[points.length - 1].time}</span>
    </div>
  `;
}

function drawDataList(list, category) {
  const area = document.getElementById("dataList");

  const recent = [...list].reverse();

  area.innerHTML = recent.map(item => `
    <div class="data-row">
      <span>${formatDate(item.time, category)}</span>
      <strong>${formatValue(item, category)}</strong>
    </div>
  `).join("");
}

function closeDetail() {
  document.getElementById("detailPanel").style.display = "none";
}

loadData();
</script>
</body>
</html>
