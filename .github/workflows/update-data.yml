name: Update Economic Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect ECOS data
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python .github/scripts/update_data.py

      - name: Save collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/economy_catalog.json

          if ! git diff --cached --quiet; then
            git commit -m "Update ECOS data catalog"
            git push
          else
            echo "No changes to save."
          fi
